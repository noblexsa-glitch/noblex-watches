<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noblex - Luxury Watches</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; background: #fafafa; color: #111; }
    header { background: #000; color: white; padding: 20px; text-align: center; }
    header h1 { font-size: 32px; letter-spacing: 3px; }
    .hero { text-align: center; padding: 60px 20px; background: white; }
    .hero h2 { font-size: 28px; margin-bottom: 15px; }
    .hero p { color: #666; font-size: 18px; }
    #products-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .product-card {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .product-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #f0f0f0;
    }
    .product-card h3 {
      font-size: 20px;
      margin: 10px 0 8px 0;
      color: #111;
      text-transform: capitalize;
    }
    .product-card p {
      font-size: 18px;
      font-weight: bold;
      color: #000;
      margin: 0 0 15px 0;
    }
    .btn-whatsapp {
      display: block;
      width: 100%;
      padding: 12px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
    }
    .btn-whatsapp:hover {
      background: #1da851;
    }
    footer { background: #000; color: white; text-align: center; padding: 30px 20px; margin-top: 60px; }
    .loading { text-align: center; padding: 40px; color: #666; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <h1>NOBLEX</h1>
  </header>

  <section class="hero">
    <h2>ساعات فاخرة تصنع الفرق</h2>
    <p>اكتشف مجموعتنا الحصرية من الساعات الراقية</p>
  </section>

  <div id="products-container">
    <div class="loading">جاري تحميل المنتوجات...</div>
  </div>

  <footer>
    <p>© 2026 Noblex. جميع الحقوق محفوظة</p>
  </footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAICfONgwK1fmZGh47poTnPpdVD5RbjWFs",
    authDomain: "noblex-c7336.firebaseapp.com",
    projectId: "noblex-c7336",
    storageBucket: "noblex-c7336.firebasestorage.app",
    messagingSenderId: "829173834258",
    appId: "1:829173834258:web:70a7ea3538df089cda2ecb",
    measurementId: "G-B332Z8ELG8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  // نمرة WhatsApp ديالك
  const whatsappNumber = "212612676691"; 

  async function loadProducts() {
    try {
      const q = query(collection(db, "products"), orderBy("order"));
      const querySnapshot = await getDocs(q);
      const container = document.getElementById('products-container');
      
      if (querySnapshot.empty) {
        container.innerHTML = '<div class="loading">لا توجد منتوجات حاليا</div>';
        return;
      }
      
      container.innerHTML = '';
      querySnapshot.forEach((doc) => {
        const p = doc.data();
        const message = `سلام، بغيت نطلب ساعة ${p.name} بثمن ${p.price} درهم من موقع Noblex`;
        const whatsappLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
        
        container.innerHTML += `
          <div class="product-card">
            <img src="${p.image || 'https://via.placeholder.com/280x280?text=No+Image'}" alt="${p.name}" loading="lazy">
            <h3>${p.name}</h3>
            <p>${p.price} درهم</p>
            <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">
              اطلب عبر واتساب
            </a>
          </div>
        `;
      });
    } catch (error) {
      console.error("Error:", error);
      document.getElementById('products-container').innerHTML = '<div class="loading">خطأ في تحميل المنتوجات</div>';
    }
  }
  
  loadProducts();
</script>

</body>
</html>
